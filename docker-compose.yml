services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://fth:${POSTGRES_PASSWORD}@postgres:5432/faretickethunter
      TA_API_KEY: ${TA_API_KEY}
      TA_API_BASE: ${TA_API_BASE:-https://api.turkishairlines.com}
      TA_RATE_LIMIT_PER_MIN: ${TA_RATE_LIMIT_PER_MIN:-50}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 */12 * * *}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: faretickethunter
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fth -d faretickethunter"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
